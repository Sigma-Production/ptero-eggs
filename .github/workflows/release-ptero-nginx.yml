name: Nginx PHP Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: "nginx-ptero:${{ matrix.php_tag }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php_tag: 8.4.27
            php_minor: "8.4"
          - php_tag: 8.3.36
            php_minor: "8.3"
          - php_tag: 8.2.35
            php_minor: "8.2"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php_tag }}
          tags: |
            ghcr.io/sigma-production/nginx-ptero:${{ matrix.php_tag }}
            ghcr.io/sigma-production/nginx-ptero:${{ matrix.php_minor }}
          cache-from: type=gha,scope=php-${{ matrix.php_minor }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php_minor }}
