name: Nginx PHP Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    name: "nginx-ptero:${{ matrix.php_tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_tag:
          - 8.4.27
          - 8.3.36
          - 8.2.35
    steps:
      - uses: actions/checkout@v2
      - uses: docker/setup-qemu-action@v1
      - uses: docker/setup-buildx-action@v1
        with:
          version: "v0.5.1"
          buildkitd-flags: --debug
      - uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PUSH_TOKEN }}
      - uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sigma-production/nginx-ptero:${{ matrix.php_tag }}
